name: Build FlashShare APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project and locate Gradle root
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z..."
              unzip -o "$z"
            fi
          done
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' | head -n 1)")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        env:
          FLASHSHARE_KEY_ALIAS: ${{ secrets.FLASHSHARE_KEY_ALIAS }}
          FLASHSHARE_STORE_PASSWORD: ${{ secrets.FLASHSHARE_STORE_PASSWORD }}
          FLASHSHARE_KEY_PASSWORD: ${{ secrets.FLASHSHARE_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/flashshare-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$FLASHSHARE_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$FLASHSHARE_STORE_PASSWORD" \
            -keypass "$FLASHSHARE_KEY_PASSWORD" \
            -dname "CN=FlashShare, OU=Mobile, O=FlashShare, L=AddisAbaba, S=AddisAbaba, C=ET"
          echo "FLASHSHARE_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FLASHSHARE_KEY_ALIAS: ${{ secrets.FLASHSHARE_KEY_ALIAS }}
          FLASHSHARE_STORE_PASSWORD: ${{ secrets.FLASHSHARE_STORE_PASSWORD }}
          FLASHSHARE_KEY_PASSWORD: ${{ secrets.FLASHSHARE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashShare-signed-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
