name: Generate Release Keystore (Run Once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate persistent JKS keystore using existing GitHub Secrets
        env:
          KEY_ALIAS: ${{ secrets.FLASHSHARE_KEY_ALIAS }}
          STORE_PWD: ${{ secrets.FLASHSHARE_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.FLASHSHARE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PWD" ] || [ -z "$KEY_PWD" ]; then
            echo "::error::Missing FLASHSHARE_KEY_ALIAS, FLASHSHARE_STORE_PASSWORD, or FLASHSHARE_KEY_PASSWORD secret."
            exit 1
          fi
          mkdir -p keystore_out
          keytool -genkeypair -v \
            -keystore keystore_out/flashshare-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PWD" \
            -keypass "$KEY_PWD" \
            -dname "CN=FlashShare, OU=Mobile, O=FlashShare, L=Addis Ababa, C=ET"
          base64 -w 0 keystore_out/flashshare-release.jks > keystore_out/FLASHSHARE_KEYSTORE_BASE64.txt

      - name: Upload keystore package (1-day retention)
        uses: actions/upload-artifact@v6
        with:
          name: flashshare-keystore-backup
          retention-days: 1
          path: keystore_out/
